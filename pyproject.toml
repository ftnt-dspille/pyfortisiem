[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyfortisiem"
dynamic = ["version"]
description = "Async + sync + MCP Python client for the FortiSIEM REST API"
readme = "README.md"
authors = [
    { name = "Dylan Spille" }
]
license = { text = "MIT" }
keywords = ["fortinet", "fortisiem", "siem", "api", "rest", "async", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]
typecheck = [
    "mypy>=1.13",
]
docs = [
    "sphinx>=8.1.3",
    "furo>=2024.8.6",
    "myst-parser>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ftnt-dspille/pyfortisiem"
Repository = "https://github.com/ftnt-dspille/pyfortisiem.git"
Issues = "https://github.com/ftnt-dspille/pyfortisiem/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.hooks.vcs]
version-file = "src/pyfortisiem/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfortisiem"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]
"examples/**" = ["B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that require a real FortiSIEM appliance (opt-in via FSM_* env)",
]
addopts = "-ra -q"

[tool.coverage.run]
source = ["pyfortisiem"]
omit = [
    "tests/*",
    "src/pyfortisiem/_version.py",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
