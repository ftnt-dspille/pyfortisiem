name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from tags.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/pyproject.toml'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ruff

      - name: Lint (ruff format check + lint)
        run: |
          ruff format --check .
          ruff check .

      - name: Test (offline only; live tests are opt-in)
        run: pytest -q --cov=pyfortisiem --cov-report=term-missing -m "not live"
